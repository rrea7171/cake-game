<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>한글시루 모으기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Jua', sans-serif;
            /* 🌟 전체화면 배경 이미지 설정 */
            background-image: url('background.jpg');
            background-size: 100% 100%; /* 🌟 비율 무시하고 무조건 가로 100%, 세로 100%로 꽉 채움! */
            background-position: center; /* 이미지가 항상 중앙을 기준으로 꽉 차게 설정 */
            background-repeat: no-repeat; /* 이미지 반복 방지 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        /* 🌟 게임 껍데기 설정: 기본 1280x720 고정, 기준점은 정중앙 */
        #game-wrapper {
            position: relative;
            width: 1280px;
            height: 720px;
            flex-shrink: 0;
            overflow: hidden;
            transform-origin: center center; /* 중앙을 기준으로 축소/확대 */
        }

        /* 각 화면 페이지 공통 설정 */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
       
        /* 대문 화면 설정 */
        #screen-start { 
            display: flex; 
            background-image: url('confetti.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #screen-start { display: flex; } 

        /* =========================================
           1. 대문 & 아이디 팝업 화면
           ========================================= */
        #start-title-img {
            position: absolute;
            top: 170px; /* 위에서 얼만큼 띄울지 결정 */
            /* 가로 기준 정중앙에 고정 */
            left: 50%;
            transform: translateX(-50%);
            width: 530px; /* 가로크기 지정 */
        }
        .pink-btn {
            background-color: #ff6699;
            color: white;
            border: 3px solid #ff99cc;
            border-radius: 50px;
            padding: 15px 50px;
            font-size: 32px;
            font-family: 'Jua', sans-serif;
            cursor: pointer;
            box-shadow: 0 5px 0 #cc3366, 0 10px 20px rgba(0,0,0,0.2);
            transition: all 0.1s;
            position: absolute;
        }
        
        .pink-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #cc3366, 0 5px 10px rgba(0,0,0,0.2);
        }

        #btn-start-game { bottom: 120px; }

        #popup-id {
            display: none; 
            position: absolute;
            width: 700px;
            height: 400px;
            background: white;
            border-radius: 40px;
            border: 5px solid #ffb3cc;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        #popup-id h2 {
            color: #ff6699;
            font-size: 45px;
            margin-bottom: 40px;
            text-shadow: 2px 2px 0px #ffe6f0;
        }

        #input-nickname {
            width: 500px;
            padding: 15px;
            font-size: 30px;
            font-family: 'Jua', sans-serif;
            border: 3px solid #ff99cc;
            border-radius: 10px;
            text-align: center;
            outline: none;
            margin-bottom: 40px;
        }

        /* 🌟 안내 문구 디자인 */
        #id-instruction {
            color: #ff6699;
            font-size: 16px;
            margin-top: -20px;
            margin-bottom: 20px;
        }

        /* 🌟 경고 문구 디자인 */
        #id-warning {
            color: #ff3333; /* 눈에 띄는 빨간색 */
            font-size: 18px;
            margin-top: -25px;
            margin-bottom: 10px;
            visibility: hidden; /* 처음엔 공간만 차지하고 보이지 않게 숨김 */
        }
        
        #input-nickname:focus { border-color: #ff3377; }
        #btn-confirm-id { position: relative; }

        /* =========================================
           2. 게임 메인 화면
           ========================================= */
        #screen-game {
            align-items: flex-start;
        }
        
        /* 🌟 상단 UI (라운드 & 모은 케이크) 박스 스타일 적용 */
        #ui-top {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
            
            background-color: #ffffff; /* 하얀 박스 */
            border: 3px solid #ff90b0; /* 테두리 */
            color: #ff7d9f; /* 텍스트 색상 */
            border-radius: 50px;
        }

        /* 🌟 생명 박스 전체 영역 */
        #ui-lives-box {
            position: absolute;
            top: 130px;
            left: 30px;
            width: 120px;
            height: 480px;
            background-color: #ffffff;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            box-sizing: border-box;
        }

        /* 공통 타이틀 텍스트 디자인 (생명, 케이크 타워) */
        .box-title {
            color: #ff7d9f;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* 하트가 담기는 영역 */
        #hearts-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px; /* 생명간의 간격 */
        }

        /* 🌟 케이크 떨어지는 곳 + 쌓이는 곳 (하나의 큰 박스) */
        #game-board {
            position: absolute;
            top: 130px;
            left: 170px;
            width: 1080px; /* 나머지 너비 모두 차지 */
            height: 480px;
            background-color: #ffffff; /* 기본 흰색 배경 */
            border-radius: 20px;
            display: flex;
            overflow: hidden; /* 테두리 밖으로 삐져나가지 않게 */
        }

        /* 🌟 왼쪽: 케이크가 떨어지는 플레이 영역 */
        #play-area {
            flex: 1; /* 남은 가로 공간 모두 차지 */
            height: 100%;
            position: relative;
            background-color: #ffffff;
            border-right: 4px dashed #f8cbda; /* 점선 테두리 */
            overflow: hidden;
        }

        /* 🌟 오른쪽: 케이크가 쌓이는 타워 영역 */
        #stack-area {
            width: 280px; /* 고정 너비 */
            height: 100%;
            position: relative;
            background: linear-gradient(to bottom, #fad7e3, #ffffff); /* 그라데이션 배경 */
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            box-sizing: border-box;
        }

        /* 🌟 새로 추가: 우경 캐릭터 스타일 */
        #character-wg {
            position: absolute;
            bottom: 11.5px;  /* 아래쪽 여백 */
            right: 20px;  /* 우측 여백 */
            width: 175px; /* 캐릭터 크기 */
            z-index: 4;   /* 케이크보다 뒤에 위치하게 설정 */
        }

        #tower {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            width: 100%;
            z-index: 5; /* 🌟 케이크가 캐릭터 위로 올라오도록 설정 */
            
            /* 💡 여기서 접시 위치를 맞춥니다! */
            padding-bottom: 110px; /* 위아래 위치: 숫자를 키우면 케이크 시작점이 더 위로 올라갑니다 */
            margin-right: 20px;    /* 좌우 위치: 접시가 중앙보다 살짝 왼쪽에 있다면 숫자를 늘려 케이크를 왼쪽으로 옮기세요 */
        }

        #game-input-area {
            position: absolute;
            bottom: 15px; /* 바닥에서 15px만큼 떨어짐 */
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #word-input {
            width: 600px;
            height: 55px;
            font-size: 35px;
            font-family: 'Jua', sans-serif;
            text-align: center;
            border: none;
            background: transparent;
            outline: none;
            background-color: #ffffff; /* 박스 색 */
            border: 3px solid #ff90b0; /* 테두리 색 */
            color: #ff7d9f; /* 글씨 색 */
            border-radius: 50px;
        }

        .cake {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: top 0.05s linear;
        }

        /* 🌟 케이크 이미지(.png) 설정 */
        .cake-img {
            width: 60px; /* 기존 이모지 크기 그대로 유지 */
            height: 60px;
            object-fit: contain; 
            margin-bottom: -5px; 
            z-index: 1;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
        }

        /* 🌟 케이크 단어 박스 색상 디자인 적용 */
        .cake-word {
            padding: 4px 15px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            z-index: 2;
            
            /* 요청하신 색상 코드 3종 세트 */
            background-color: #ffffff; /* 박스 색 */
            border: 1.5px solid #ff90b0; /* 테두리 색 */
            color: #ff7d9f; /* 글씨 색 */
        }

        /* 🌟 타워에 쌓이는 케이크 이미지(.png) 설정 */
        .stacked-cake-img {
            width: 70px; /* 기존 이모지 크기 그대로 유지 */
            height: 70px;
            object-fit: contain;
            margin-top: -25px; /* 위아래로 포개어지게 설정 */
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
            animation: dropIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        @keyframes dropIn {
            0% { transform: translateY(-50px) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            color: #ff3377;
            text-shadow: 4px 4px 0 #fff;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* =========================================
           3. 클리어 화면 & 게임오버
           ========================================= */
        /* 🌟 클리어 화면 */
        #screen-clear { 
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding-top: 150px; /* 타이틀 이미지 위치에 맞게 조절 */
            box-sizing: border-box;
        }
        #clear-title-img {
            width: 400px;
            margin-bottom: 30px;
        }

        #clear-nickname-display {
            width: 750px;
            height: 180px;
            /* 🌟 게임 화면과 동일한 색상 지정 */
            background-color: #ffffff; 
            border: 3px solid #ff90b0; 
            color: #ff7d9f; 
            border-radius: 20px;
            font-size: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
        }

        .clear-btn-group {
            display: flex;
            gap: 40px;
        }

        .clear-btn-group .pink-btn {
            position: relative; /* 공통 버튼의 위치 고정 속성 덮어쓰기 */
            font-size: 28px;
            padding: 10px 40px;
        }

        /* 🌟 게임오버 화면 스타일 (클리어 화면과 동일한 구조) */
        #screen-gameover { 
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding-top: 210px; /* 위쪽 여백 */
            box-sizing: border-box;
        }

        #game-over-title-img {
            width: 300px;
            margin-bottom: 30px;
        }

        #game-over-text-img {
            width: 200px;
            margin-bottom: 60px;
        }
        
        #btn-restart {
            position: relative;
            font-size: 22px;
            padding: 8px 30px;
        }

    </style>

<body>

    <div id="game-wrapper">
        
        <!-- 1. 대문 화면 -->
        <div id="screen-start" class="screen">
            <img src="title.png" alt="한글시루 모으기" id="start-title-img"> // 게임타이틀 띄우기 //
            <button id="btn-start-game" class="pink-btn">★ 게임 시작 ★</button>

            <!-- 아이디 입력 팝업 -->
            <div id="popup-id">
                <h2>아이디 입력</h2>
                
                <!-- 입력창 위 안내 문구 -->
                <p id="id-instruction">트위터 아이디를 입력하세요. 아이디는 @, 영어, 숫자, _(언더바)만 입력할 수 있습니다.</p>
                
                <input type="text" id="input-nickname" placeholder="@아이디" autocomplete="off">
                
                <!-- 입력창 아래 경고 문구 (처음엔 숨겨둠) -->
                <p id="id-warning">아이디를 입력해 주세요.</p>
                
                <button id="btn-confirm-id" class="pink-btn">★ 확인 ★</button>
            </div>
        </div>

        <!-- 2. 게임 화면 -->
        <div id="screen-game" class="screen">
            
            <!-- 상단 UI -->
            <div id="ui-top">
                <div style="width:150px; text-align:right;">라운드 &nbsp;<span id="round">1</span></div>
                <div style="width:250px; text-align:left;">&nbsp;모은 케이크 &nbsp;<span id="score">0</span> / 7</div>
            </div>
            
            <!-- 🌟 좌측 생명 박스 -->
            <div id="ui-lives-box">
                <div class="box-title">생명</div>
                <div id="hearts-container"></div> <!-- 하트는 여기에 생성됨 -->
            </div>
            
            <!-- 🌟 중앙~우측 하나로 합쳐진 게임 보드 -->
            <div id="game-board">
                <!-- 떨어지는 영역 -->
                <div id="play-area">
                    <div id="message-overlay">ROUND 1</div>
                </div>
                <!-- 쌓이는 타워 영역 -->
                <div id="stack-area">
                    <div class="box-title" style="position: absolute; top: 25px;">케이크 타워</div>
                    <!-- 🌟 추가: 우경 캐릭터 이미지 (타워보다 먼저 적어주세요!) -->
                    <img src="wookyung.png" id="character-wg" alt="우경">
                    <div id="tower"></div>
                </div>
            </div>

            <!-- 타자 입력창 -->
            <div id="game-input-area"><input type="text" id="word-input" autocomplete="off"></div>
        </div>

        <!-- 🌟 3. 클리어 화면 통째로 수정 -->
        <div id="screen-clear" class="screen">
            <img src="clear_title.png" alt="Clear!" id="clear-title-img">
            <div id="clear-nickname-display">닉네임</div>
            <div class="clear-btn-group">
                <button id="btn-share" class="pink-btn">★ 공유하기 ★</button>
                <button id="btn-home" class="pink-btn" onclick="location.reload()">★ 처음으로 ★</button>
            </div>
        </div>

        <!-- 🌟 게임 화면 안에 있는 게임오버 오버레이 수정 -->
        <div id="screen-gameover" class="screen">
            <img src="gameover_title.png" alt="GAME OVER" id="game-over-title-img">
            <img src="gameover_text.png" alt="디저트가 무너졌어요... 다시 도전해볼까요?" id="game-over-text-img">
            <button id="btn-restart" class="pink-btn" onclick="location.reload()">★ 다시하기 ★</button>
        </div>

    </div>

    <script>
        // 🌟 화면 비율 자동 맞춤 기능 추가 🌟
        function resizeGame() {
            const wrapper = document.getElementById('game-wrapper');
            // 브라우저 창 크기와 게임 원본 크기(1280x720)의 비율 계산
            const scaleWidth = window.innerWidth / 1280;
            const scaleHeight = window.innerHeight / 720;
            // 가로와 세로 중 더 좁은 쪽에 맞춰서 잘리지 않게 스케일 조정
            const scale = Math.min(scaleWidth, scaleHeight);
            
            wrapper.style.transform = `scale(${scale})`;
        }
        
        // 창 크기가 변할 때마다 함수 실행
        window.addEventListener('resize', resizeGame);
        // 처음 페이지 열었을 때도 한번 실행해서 맞춰줌
        resizeGame();


        // --- 아래는 기존과 동일한 게임 로직입니다 ---
        const screenStart = document.getElementById('screen-start');
        const screenGame = document.getElementById('screen-game');
        const screenClear = document.getElementById('screen-clear');
        const screenGameOver = document.getElementById('screen-gameover');
        
        const btnStartGame = document.getElementById('btn-start-game');
        const popupId = document.getElementById('popup-id');
        const inputNickname = document.getElementById('input-nickname');
        const btnConfirmId = document.getElementById('btn-confirm-id');
        const idWarning = document.getElementById('id-warning');
        
        const clearNicknameDisplay = document.getElementById('clear-nickname-display');
        const btnShare = document.getElementById('btn-share');

        let userNickname = "";

        const wordList = [
            '크림', '설탕', '우유', '버터', '딸기', '체리', 
            '조각', '계란', '토핑', '달콤', '폭신', 
            '머랭', '오븐', '생크림', '핫케익', '롤케이크',
            '케이크', '초콜릿', '바닐라', '거품기', '밀가루', 
            '딸기잼', '사과잼', '블루베리', '산딸기', '컵케익', 
            '마카롱', '젤라틴', '코코아', '슈크림', '달콤함', 
            '사르르', '몽글몽글', '포근함', '보슬보슬', '촉촉함', 
            '짤주머니', '카스테라', '쉬폰케익', '머랭쿠키', '녹차가루', 
            '딸기케이크', '치즈케이크', '초코케이크', '무스케이크', '티라미수', 
            '당근케이크', '생크림케익', '녹차케이크', '고구마케익', '휘핑크림', 
            '슈가파우더', '바닐라빈', '베이킹소다', '케이크시트', '마스카포네',
            '크림치즈', '버터크림', '생일축하해', '까눌레', '녹차',
            '추로스'
        ];

        const SpecialwordList = [
            '아기자기', '자포자기', '배틀히어로', '솔탱탈출기', '여우경', 
            '이하진', '우경하진', '자기듀오', '바니바니파르페'];
        let normalCakeCount = 0; // 일반 케이크가 나온 횟수를 셀 변수
        let recentWords = [];    // 🌟 최근 나온 단어 5개를 기억할 배열

        const cakeImages = ['cake1.png', 'cake2.png', 'cake3.png', 'cake4.png', 'cake5.png'];
        
        let round = 1;
        const maxRound = 10;
        let stackedCount = 0;
        let maxLives = 5;
        let lives = maxLives;
        
        /* 떨어지는 스피드 초기설정 */ 
        let fallSpeed = 0.7; 
        let spawnRate = 2500; 
        
        let activeCakes = []; 
        let gameInterval; 
        let spawnInterval; 
        let isGameOver = false;

        let lastSpawnX = -1; // 🌟 새로 떨어질 케이크가 겹치지 않도록 이전 위치를 기억하는 변수

        const playArea = document.getElementById('play-area');
        const tower = document.getElementById('tower');
        const wordInput = document.getElementById('word-input');
        const roundDisplay = document.getElementById('round');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('hearts-container');
        const messageOverlay = document.getElementById('message-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const gameOverBg = document.getElementById('game-over-bg'); // 🌟 추가된 부분


        // 이벤트 리스너 설정
        btnStartGame.addEventListener('click', () => {
            popupId.style.display = 'flex';
            inputNickname.focus();
        });

        // 실시간 입력 제한 (@, 영어, 숫자, _ 만 허용)
        inputNickname.addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^@a-zA-Z0-9_]/g, '');
            if (e.target.value.length > 0) {
                idWarning.style.visibility = 'hidden';
            }
        });

        // '확인' 버튼 클릭 -> 아이디 저장 및 게임 화면 이동
        btnConfirmId.addEventListener('click', () => {
            userNickname = inputNickname.value.trim();
            
            // 🚨 1. 아무것도 입력하지 않았을 때
            if (userNickname === "") {
                idWarning.textContent = "아이디를 입력해 주세요."; // 빈칸용 경고 문구로 변경
                idWarning.style.visibility = 'visible'; 
                inputNickname.focus(); 
                return; // 여기서 멈춤
            }
            
            // 🚨 2. 맨 앞에 @가 없는 경우 (새로 추가된 로직!)
            if (!userNickname.startsWith('@')) {
                idWarning.textContent = "아이디는 '@아이디'형태로 입력해 주세요."; // @ 누락용 경고 문구로 변경
                idWarning.style.visibility = 'visible'; 
                inputNickname.focus(); 
                return; // 여기서 멈춤
            }
            
            screenStart.style.display = 'none';
            screenGame.style.display = 'flex';
            
            initGame(); // 게임 시작!
        });
        
        // 아이디 창에서 엔터키 쳐도 확인 버튼 눌리게 설정
        inputNickname.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') btnConfirmId.click();
        });

        btnShare.addEventListener('click', () => {
            const text = '#우경이의_읏쇼읏쇼_케이크쌓기 \n#하진이_생일_기념_926단_케이크 \n';
            const url = encodeURIComponent(window.location.href); 
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${url}`, '_blank');
        });

        // 게임 함수들
        function updateLivesDisplay() {
            livesDisplay.innerHTML = '';
            for(let i=0; i<maxLives; i++) {
                const heartImg = document.createElement('img');
                heartImg.src = 'life.png';
                heartImg.style.width = '50px'; // 기존 이모티콘과 동일한 크기
                heartImg.style.height = '50px';
                heartImg.style.objectFit = 'contain';
                
                // 목숨이 깎이면 이미지를 흑백으로 만들고 반투명하게 함
                if(i >= lives) {
                    heartImg.style.opacity = '0.2';
                    heartImg.style.filter = 'grayscale(100%)';
                }
                livesDisplay.appendChild(heartImg);
            }
        }

        function showMessage(msg) {
            messageOverlay.textContent = msg;
            messageOverlay.style.opacity = 1;
            setTimeout(() => { messageOverlay.style.opacity = 0; }, 1500);
        }

        // 단어 생성 로직
        function spawnCake() {
            if (isGameOver) return;
            
            let word;
            
            /* 5개 나오면 1개 스페셜 단어가 나오도록 설정 */
            if (normalCakeCount >= 5) {
                word = SpecialwordList[Math.floor(Math.random() * SpecialwordList.length)];
                normalCakeCount = 0; // 스페셜이 나왔으므로 카운트를 다시 0으로 리셋
            } else {
                // 🌟 최근 5개 목록(recentWords)에 없는 단어들만 골라냄
                const availableWords = wordList.filter(w => !recentWords.includes(w));
                
                // 걸러진 단어들 중에서 랜덤 선택
                word = availableWords[Math.floor(Math.random() * availableWords.length)];
                
                // 최근 목록에 추가
                recentWords.push(word);
                
                // 최근 목록이 5개를 넘어가면 가장 오래된 단어 제거
                if (recentWords.length > 5) {
                    recentWords.shift();
                }
                
                normalCakeCount++;
            }
            
            const imageSrc = cakeImages[Math.floor(Math.random() * cakeImages.length)];
            
            const cakeEl = document.createElement('div');
            cakeEl.className = 'cake';
            
            const minX = 20;
            const maxX = playArea.clientWidth - 150;
            let randomX;
            let attempts = 0;
            let isOverlapping;
            
            // 기존 케이크들의 위치(X, Y)를 모두 파악해서 겹치지 않는 빈자리 찾기
            do {
                randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
                isOverlapping = false;
                
                for (let cake of activeCakes) {
                    // 화면 위쪽(방금 생성됨)에 있으면서 가로 위치도 가깝다면 겹친다고 판단!
                    if (cake.y < 50 && Math.abs(randomX - parseInt(cake.element.style.left)) < 120) {
                        isOverlapping = true;
                        break;
                    }
                }
                attempts++;
            } while (isOverlapping && attempts < 15);
            
            cakeEl.style.left = randomX + 'px';
            cakeEl.style.top = '-100px'; 
            
            cakeEl.innerHTML = `
                <img src="${imageSrc}" class="cake-img" alt="케이크">
                <div class="cake-word">${word}</div>
            `;
            
            playArea.appendChild(cakeEl);
            
            activeCakes.push({
                element: cakeEl,
                word: word,
                y: -100,
                imageSrc: imageSrc 
            });
        }

        function gameLoop() {
            if (isGameOver) return;
            
            for (let i = 0; i < activeCakes.length; i++) {
                let cake = activeCakes[i];
                cake.y += fallSpeed; 
                cake.element.style.top = cake.y + 'px';
                
                if (cake.y > playArea.clientHeight) {
                    playArea.removeChild(cake.element);
                    activeCakes.splice(i, 1); 
                    i--; 
                    
                    lives--; 
                    updateLivesDisplay();
                    
                    document.getElementById('game-wrapper').style.transform = `scale(${Math.min(window.innerWidth/1280, window.innerHeight/720)}) translate(10px, 10px)`;
                    setTimeout(() => document.getElementById('game-wrapper').style.transform = `scale(${Math.min(window.innerWidth/1280, window.innerHeight/720)}) translate(0, 0)`, 50);
                    
                    if (lives <= 0) endGame();
                }
            }
        }

        function handleInput(e) {
            if (e.key === 'Enter' && !isGameOver) {
                const typedWord = wordInput.value.trim();
                wordInput.value = ''; 
                
                let matchedIndex = -1;
                let maxAvgY = -999;
                
                for (let i = 0; i < activeCakes.length; i++) {
                    if (activeCakes[i].word === typedWord) {
                        if (activeCakes[i].y > maxAvgY) {
                            maxAvgY = activeCakes[i].y;
                            matchedIndex = i;
                        }
                    }
                }
                
                if (matchedIndex !== -1) {
                    const matchedCake = activeCakes[matchedIndex];
                    playArea.removeChild(matchedCake.element); 
                    
                    stackCake(matchedCake.imageSrc); // 이모지 대신 이미지 경로 전달
                    
                    activeCakes.splice(matchedIndex, 1); 
                    stackedCount++;
                    scoreDisplay.textContent = stackedCount;
                    
                    if (stackedCount >= 7) {
                        if (round >= maxRound) gameClear();
                        else nextRound();
                    }
                }
            }
        }

        // 🌟 타워에 이미지 쌓기
        function stackCake(imageSrc) {
            const stackedEl = document.createElement('img'); // div 대신 img로 생성
            stackedEl.src = imageSrc;
            stackedEl.className = 'stacked-cake-img';
            stackedEl.alt = '쌓인 케이크';
            tower.appendChild(stackedEl); 
        }

        function nextRound() {
            round++;
            roundDisplay.textContent = round;
            stackedCount = 0;
            scoreDisplay.textContent = stackedCount;
            
            tower.innerHTML = '';
            
            activeCakes.forEach(cake => playArea.removeChild(cake.element));
            activeCakes = [];
            
            /* 난이도 올라갈때마다 스피드 조절 */
            fallSpeed += 0.30; 
            spawnRate = Math.max(700, spawnRate - 200); 
            
            clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnCake, spawnRate);
            
            showMessage(`ROUND ${round}`);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            
            // 🌟 1. 브라우저 전체 배경을 게임오버 배경으로 변경 (창 크기에 맞춰 꽉 참)
            document.body.style.backgroundImage = "url('gameover_bg.jpg')";
            
            // 🌟 2. 게임 화면을 숨기고 게임오버 화면을 띄움
            screenGame.style.display = 'none';
            screenGameOver.style.display = 'flex';
            
            wordInput.blur(); 
        }

        function gameClear() {
            isGameOver = true;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            
            screenGame.style.display = 'none';
            screenClear.style.display = 'flex';
            
            clearNicknameDisplay.textContent = userNickname;
        }

        function initGame() {
            updateLivesDisplay();
            showMessage('ROUND 1');
            
            gameInterval = setInterval(gameLoop, 30); 
            spawnInterval = setInterval(spawnCake, spawnRate);
            
            wordInput.addEventListener('keypress', handleInput);
            
            document.addEventListener('click', () => {
                if(!isGameOver && screenGame.style.display !== 'none') wordInput.focus();
            });
            wordInput.focus();
        }
    </script>
</body>
</html>
