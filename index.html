<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>한글시루 모으기</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Jua', sans-serif;
            background-image: url('background.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }

        #game-wrapper {
            position: relative;
            width: 1280px;
            height: 720px;
            flex-shrink: 0;
            overflow: hidden;
            transform-origin: center center; 
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
       
        #screen-start { 
            display: flex; 
            background-image: url('confetti.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #screen-start { display: flex; } 

        #start-title-img {
            position: absolute;
            top: 170px;
            left: 50%;
            transform: translateX(-50%);
            width: 530px; 
        }

        .img-btn {
            cursor: pointer;
            transition: transform 0.1s ease;
            user-select: none;
            -webkit-user-drag: none;
            object-fit: contain;
        }

        .img-btn:active {
            transform: scale(0.95);
        }

        #btn-start-game {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            height: 70px;
        }

        #btn-start-game:active {
            transform: translateX(-50%) scale(0.95);
        }

        #btn-confirm-id {
            height: 70px;
        }

        .clear-btn-group {
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .clear-btn-group .img-btn {
            height: 60px;
        }

        #btn-restart {
            height: 50px;
        }

        #popup-id {
            display: none; 
            position: absolute;
            width: 700px;
            height: 400px;
            background: white;
            border-radius: 40px;
            border: 5px solid #ffb3cc;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        #id-title-img {
            height: 45px;
            margin-bottom: 40px;
            object-fit: contain;
        }

        #input-nickname {
            width: 500px;
            padding: 15px;
            font-size: 30px;
            font-family: 'Jua', sans-serif;
            border: 3px solid #ff99cc;
            border-radius: 10px;
            text-align: center;
            outline: none;
            margin-bottom: 40px;
        }

        #id-instruction {
            color: #ff6699;
            font-size: 16px;
            margin-top: -20px;
            margin-bottom: 20px;
        }

        #id-warning {
            color: #ff3333;
            font-size: 18px;
            margin-top: -25px;
            margin-bottom: 10px;
            visibility: hidden;
        }
        
        #input-nickname:focus { border-color: #ff3377; }
        #btn-confirm-id { position: relative; }

        #screen-game {
            align-items: flex-start;
        }
        
        #ui-top {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
            
            background-color: #ffffff;
            border: 3px solid #ff90b0;
            color: #ff7d9f;
            border-radius: 50px;
        }

        #ui-lives-box {
            position: absolute;
            top: 130px;
            left: 30px;
            width: 120px;
            height: 480px;
            background-color: #ffffff;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            box-sizing: border-box;
        }

        .box-title-img {
            height: 30px;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }

        #ui-lives-box .box-title-img {
            margin-bottom: 20px;
        }

        #stack-area .box-title-img {
            position: absolute;
            top: 25px;
        }

        #hearts-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        #game-board {
            position: absolute;
            top: 130px;
            left: 170px;
            width: 1080px;
            height: 480px;
            background-color: #ffffff;
            border-radius: 20px;
            display: flex;
            overflow: hidden;
        }

        #play-area {
            flex: 1;
            height: 100%;
            position: relative;
            background-color: #ffffff;
            border-right: 4px dashed #f8cbda;
            overflow: hidden;
        }

        #stack-area {
            width: 280px;
            height: 100%;
            position: relative;
            background: linear-gradient(to bottom, #fad7e3, #ffffff);
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            box-sizing: border-box;
        }

        #character-wg {
            position: absolute;
            bottom: 11.5px;
            right: 20px;
            width: 175px;
            z-index: 4;
        }

        #tower {
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            width: 100%;
            z-index: 5;
            padding-bottom: 110px;
            margin-right: 20px;
        }

        #game-input-area {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 700px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #word-input {
            width: 600px;
            height: 55px;
            font-size: 35px;
            font-family: 'Jua', sans-serif;
            text-align: center;
            border: none;
            background: transparent;
            outline: none;
            background-color: #ffffff;
            border: 3px solid #ff90b0;
            color: #ff7d9f;
            border-radius: 50px;
        }

        .cake {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: top 0.05s linear;
        }

        .cake-img {
            width: 60px;
            height: 60px;
            object-fit: contain; 
            margin-bottom: -5px; 
            z-index: 1;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.1));
        }

        .cake-word {
            padding: 4px 15px;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            z-index: 2;
            
            background-color: #ffffff;
            border: 1.5px solid #ff90b0;
            color: #ff7d9f;
        }

        .stacked-cake-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-top: -25px;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
            animation: dropIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        @keyframes dropIn {
            0% { transform: translateY(-50px) scale(0.5); opacity: 0; }
            100% { transform: translateY(0) scale(1); opacity: 1; }
        }

        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 80px;
            object-fit: contain;
            z-index: 20;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #screen-clear { 
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding-top: 150px;
            box-sizing: border-box;
        }
        #clear-title-img {
            width: 400px;
            margin-bottom: 30px;
        }

        #clear-nickname-display {
            width: 750px;
            height: 180px;
            background-color: #ffffff; 
            border: 3px solid #ff90b0; 
            color: #ff7d9f; 
            border-radius: 20px;
            font-size: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
        }

        .clear-btn-group {
            display: flex;
            gap: 40px;
        }

        .clear-btn-group .pink-btn {
            position: relative;
            font-size: 28px;
            padding: 10px 40px;
        }

        #screen-gameover { 
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; 
            padding-top: 210px;
            box-sizing: border-box;
        }

        #game-over-title-img {
            width: 300px;
            margin-bottom: 30px;
        }

        #game-over-text-img {
            width: 200px;
            margin-bottom: 60px;
        }
        
        #btn-restart {
            position: relative;
            font-size: 22px;
            padding: 8px 30px;
        }

    </style>

<body>

    <div id="game-wrapper">
        
        <div id="screen-start" class="screen">
            <img src="title.png" alt="한글시루 모으기" id="start-title-img">

                <div style="width:150px; text-align:right;">라운드 &nbsp;<span id="round">1</span></div>

            <div id="ui-lives-box">
                <img src="title_life.png" class="box-title-img" alt="생명">

            </div>
            
            <div id="game-board">

                <img src="btn_share.png" id="btn-share" class="img-btn" alt="공유하기">

            <img src="btn_restart.png" id="btn-restart" class="img-btn" alt="다시하기" onclick="location.reload()">
        </div>

    </div>

    <script>
        function resizeGame() {
            const wrapper = document.getElementById('game-wrapper');
            const scaleWidth = window.innerWidth / 1280;
            const scaleHeight = window.innerHeight / 720;
            const scale = Math.min(scaleWidth, scaleHeight);
            
            wrapper.style.transform = `scale(${scale})`;
        }
        
        window.addEventListener('resize', resizeGame);
        resizeGame();

        const screenStart = document.getElementById('screen-start');
        const screenGame = document.getElementById('screen-game');
        const screenClear = document.getElementById('screen-clear');
        const screenGameOver = document.getElementById('screen-gameover');
        
        const btnStartGame = document.getElementById('btn-start-game');
        const popupId = document.getElementById('popup-id');
        const inputNickname = document.getElementById('input-nickname');
        const btnConfirmId = document.getElementById('btn-confirm-id');
        const idWarning = document.getElementById('id-warning');
        
        const clearNicknameDisplay = document.getElementById('clear-nickname-display');
        const btnShare = document.getElementById('btn-share');

        let userNickname = "";

        const wordList = [
            '크림', '설탕', '우유', '버터', '딸기', '체리', 
            '조각', '계란', '토핑', '달콤', '폭신', 
            '머랭', '오븐', '생크림', '핫케익', '롤케이크',
            '케이크', '초콜릿', '바닐라', '거품기', '밀가루', 
            '딸기잼', '사과잼', '블루베리', '산딸기', '컵케익', 
            '마카롱', '젤라틴', '코코아', '슈크림', '달콤함', 
            '사르르', '몽글몽글', '포근함', '보슬보슬', '촉촉함', 
            '짤주머니', '카스테라', '쉬폰케익', '머랭쿠키', '녹차가루', 
            '딸기케이크', '치즈케이크', '초코케이크', '무스케이크', '티라미수', 
            '당근케이크', '생크림케익', '녹차케이크', '고구마케익', '휘핑크림', 
            '슈가파우더', '바닐라빈', '베이킹소다', '케이크시트', '마스카포네',
            '크림치즈', '버터크림', '생일축하해', '까늘레', '녹차',
            '추로스'
        ];

        const SpecialwordList = [
            '아기자기', '자포자기', '배틀히어로', '솔탱탈출기', '여우경', 
            '이하진', '우경하진', '자기듀오', '바니바니파르페'];
        let normalCakeCount = 0;
        let recentWords = [];

        const cakeImages = ['cake1.png', 'cake2.png', 'cake3.png', 'cake4.png', 'cake5.png'];
        
        let round = 1;
        const maxRound = 10;
        let stackedCount = 0;
        let maxLives = 5;
        let lives = maxLives;
        
        let fallSpeed = 0.7; 
        let spawnRate = 2500; 
        
        let activeCakes = []; 
        let gameInterval; 
        let spawnInterval; 
        let isGameOver = false;

        let lastSpawnX = -1;

        const playArea = document.getElementById('play-area');
        const tower = document.getElementById('tower');
        const wordInput = document.getElementById('word-input');
        const roundDisplay = document.getElementById('round');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('hearts-container');
        const messageOverlay = document.getElementById('message-overlay');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const gameOverBg = document.getElementById('game-over-bg');


        btnStartGame.addEventListener('click', () => {
            popupId.style.display = 'flex';
            inputNickname.focus();
        });

        inputNickname.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^@a-zA-Z0-9_]/g, '');
            let atCount = 0;
            val = val.replace(/@/g, () => (++atCount === 1 ? '@' : ''));

            if (val.length > 20) {
                val = val.slice(0, 20);
            }
            
            e.target.value = val;

            if (e.target.value.length > 0) {
                idWarning.style.visibility = 'hidden';
            }
        });

        btnConfirmId.addEventListener('click', () => {
            userNickname = inputNickname.value.trim();
            const rawId = userNickname.replace(/^@/, '');
            
            if (userNickname === "" || rawId.length < 3) {
                idWarning.textContent = "아이디를 입력해 주세요.";
                idWarning.style.visibility = 'visible'; 
                inputNickname.focus(); 
                return;
            }
            
            if (!userNickname.startsWith('@')) {
                idWarning.textContent = "아이디는 '@아이디'형태로 입력해 주세요.";
                idWarning.style.visibility = 'visible'; 
                inputNickname.focus(); 
                return;
            }

            screenStart.style.display = 'none';
            screenGame.style.display = 'flex';
            
            initGame();
        });
        
        inputNickname.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') btnConfirmId.click();
        });

        btnShare.addEventListener('click', () => {
            const text = '#우경이의_읏쇼읏쇼_케이크쌓기 \n#하진이_생일_기념_926단_케이크 \n';
            const shareUrl = "https://ganadara.vercel.app/?v=1";
            const url = encodeURIComponent(shareUrl); 
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${url}`, '_blank');
        });

        function updateLivesDisplay() {
            livesDisplay.innerHTML = '';
            for(let i=0; i<maxLives; i++) {
                const heartImg = document.createElement('img');
                heartImg.src = 'life.png';
                heartImg.style.width = '50px';
                heartImg.style.height = '50px';
                heartImg.style.objectFit = 'contain';
                
                if(i >= lives) {
                    heartImg.style.opacity = '0.2';
                    heartImg.style.filter = 'grayscale(100%)';
                }
                livesDisplay.appendChild(heartImg);
            }
        }

        function showMessage(roundNum) {
            messageOverlay.src = `round${roundNum}.png`;
            messageOverlay.style.opacity = 1;
            setTimeout(() => { messageOverlay.style.opacity = 0; }, 1500);
        }

        function spawnCake() {
            if (isGameOver) return;
            
            let word;
            
            if (normalCakeCount >= 5) {
                word = SpecialwordList[Math.floor(Math.random() * SpecialwordList.length)];
                normalCakeCount = 0;
            } else {
                const availableWords = wordList.filter(w => !recentWords.includes(w));
                
                word = availableWords[Math.floor(Math.random() * availableWords.length)];
                
                recentWords.push(word);
                
                if (recentWords.length > 5) {
                    recentWords.shift();
                }
                
                normalCakeCount++;
            }
            
            const imageSrc = cakeImages[Math.floor(Math.random() * cakeImages.length)];
            
            const cakeEl = document.createElement('div');
            cakeEl.className = 'cake';
            
            const minX = 20;
            const maxX = playArea.clientWidth - 150;
            let randomX;
            let attempts = 0;
            let isOverlapping;
            
            do {
                randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
                isOverlapping = false;
                
                for (let cake of activeCakes) {
                    if (cake.y < 50 && Math.abs(randomX - parseInt(cake.element.style.left)) < 120) {
                        isOverlapping = true;
                        break;
                    }
                }
                attempts++;
            } while (isOverlapping && attempts < 15);
            
            cakeEl.style.left = randomX + 'px';
            cakeEl.style.top = '-100px'; 
            
            cakeEl.innerHTML = `
                <img src="${imageSrc}" class="cake-img" alt="케이크">
                <div class="cake-word">${word}</div>
            `;
            
            playArea.appendChild(cakeEl);
            
            activeCakes.push({
                element: cakeEl,
                word: word,
                y: -100,
                imageSrc: imageSrc 
            });
        }

        function gameLoop() {
            if (isGameOver) return;
            
            for (let i = 0; i < activeCakes.length; i++) {
                let cake = activeCakes[i];
                cake.y += fallSpeed; 
                cake.element.style.top = cake.y + 'px';
                
                if (cake.y > playArea.clientHeight) {
                    playArea.removeChild(cake.element);
                    activeCakes.splice(i, 1); 
                    i--; 
                    
                    lives--; 
                    updateLivesDisplay();
                    
                    document.getElementById('game-wrapper').style.transform = `scale(${Math.min(window.innerWidth/1280, window.innerHeight/720)}) translate(10px, 10px)`;
                    setTimeout(() => document.getElementById('game-wrapper').style.transform = `scale(${Math.min(window.innerWidth/1280, window.innerHeight/720)}) translate(0, 0)`, 50);
                    
                    if (lives <= 0) endGame();
                }
            }
        }

        function handleInput(e) {
            if (e.key === 'Enter' && !isGameOver) {
                const typedWord = wordInput.value.trim();
                wordInput.value = ''; 
                
                let matchedIndex = -1;
                let maxAvgY = -999;
                
                for (let i = 0; i < activeCakes.length; i++) {
                    if (activeCakes[i].word === typedWord) {
                        if (activeCakes[i].y > maxAvgY) {
                            maxAvgY = activeCakes[i].y;
                            matchedIndex = i;
                        }
                    }
                }
                
                if (matchedIndex !== -1) {
                    const matchedCake = activeCakes[matchedIndex];
                    playArea.removeChild(matchedCake.element); 
                    
                    stackCake(matchedCake.imageSrc);
                    
                    activeCakes.splice(matchedIndex, 1); 
                    stackedCount++;
                    scoreDisplay.textContent = stackedCount;
                    
                    if (stackedCount >= 7) {
                        if (round >= maxRound) gameClear();
                        else nextRound();
                    }
                }
            }
        }

        function stackCake(imageSrc) {
            const stackedEl = document.createElement('img');
            stackedEl.src = imageSrc;
            stackedEl.className = 'stacked-cake-img';
            stackedEl.alt = '쌓인 케이크';
            tower.appendChild(stackedEl); 
        }

        function nextRound() {
            round++;
            roundDisplay.textContent = round;
            stackedCount = 0;
            scoreDisplay.textContent = stackedCount;
            
            tower.innerHTML = '';
            
            activeCakes.forEach(cake => playArea.removeChild(cake.element));
            activeCakes = [];
            
            fallSpeed += 0.30; 
            spawnRate = Math.max(700, spawnRate - 200); 
            
            clearInterval(spawnInterval);
            spawnInterval = setInterval(spawnCake, spawnRate);
            
            showMessage(round);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            
            document.body.style.backgroundImage = "url('gameover_bg.jpg')";
            
            screenGame.style.display = 'none';
            screenGameOver.style.display = 'flex';
            
            wordInput.blur(); 
        }

        function gameClear() {
            isGameOver = true;
            clearInterval(gameInterval);
            clearInterval(spawnInterval);
            
            screenGame.style.display = 'none';
            screenClear.style.display = 'flex';
            
            clearNicknameDisplay.textContent = userNickname;
        }

        function initGame() {
            updateLivesDisplay();
            showMessage(1);
            
            gameInterval = setInterval(gameLoop, 30); 
            spawnInterval = setInterval(spawnCake, spawnRate);
            
            wordInput.addEventListener('keypress', handleInput);
            
            document.addEventListener('click', () => {
                if(!isGameOver && screenGame.style.display !== 'none') wordInput.focus();
            });
            wordInput.focus();
        }
    </script>
</body>
</html>
